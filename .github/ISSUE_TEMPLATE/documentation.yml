name: Documentation or translation feedback
description: Report unclear wording, a broken link, or a language issue.
title: "[Docs]: "
body:
  - type: markdown
    attributes:
      value: This report is public. Include only public wording and non-sensitive examples.
  - type: input
    id: location
    attributes:
      label: Page or document
      description: Public URL or repository file path.
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
      description: Quote only the small public passage needed to locate the problem.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement (optional)
  - type: checkboxes
    id: privacy
    attributes:
      label: Public reporting check
      options:
        - label: This report and its attachments contain no private information or internal software files.
          required: true
