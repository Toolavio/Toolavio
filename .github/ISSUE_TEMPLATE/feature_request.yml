name: Feature or usability request
description: Describe a real task and the outcome you need.
title: "[Idea]: "
body:
  - type: markdown
    attributes:
      value: |
        Suggestions are public and do not imply a delivery commitment. Please use fictional examples and do not include private documents or account details.
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Describe the real task, not just a proposed feature name.
    validations:
      required: true
  - type: textarea
    id: difficulty
    attributes:
      label: What is difficult with the current experience?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What result would make it useful?
      description: Explain how you would recognize success. Include formats or settings when relevant.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Existing tool, workaround, or constraints (optional)
      description: Browser, language, offline need, accessibility requirement, or a related public tool URL.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public reporting check
      options:
        - label: This suggestion contains no personal data, private files, credentials, or internal source code.
          required: true
